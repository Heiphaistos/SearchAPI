name: Update API database

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data/apis.json from public-apis + curated lists
        run: python3 scripts/build_data.py
      - name: Commit and push if the database changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apis.json data/apis.js
          if git diff --cached --quiet -- data/apis.js; then
            echo "No changes"
          else
            git commit -m "data: refresh API database"
            git push
          fi
